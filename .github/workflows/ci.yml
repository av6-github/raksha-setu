name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze_and_test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Secret Scan (Verify No Commits Contain .env or Secret Keys)
        run: |
          echo "Scanning for accidental secret leaks..."
          ! grep -rn "gsk_" . --exclude-dir={.git,.github} --exclude={.env.example}
          ! grep -rn "pcsk_" . --exclude-dir={.git,.github} --exclude={.env.example}
          test ! -f .env || (echo "ERROR: .env file checked into git!" && exit 1)
          echo "Secret scan passed."

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage
